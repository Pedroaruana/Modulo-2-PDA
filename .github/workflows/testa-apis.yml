name: testa apis

on:
  workflow_dispatch:

jobs:
  mercadoagil-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aula-03/parte-2-mercadoagil-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: sobe o servidor e testa as rotas
        run: |
          npm start > server.log 2>&1 &
          sleep 3
          cat server.log
          curl -fsi http://localhost:3000/
          echo
          curl -fsi http://localhost:3000/produtos
          echo
          curl -fsi http://localhost:3000/vendedores
          echo
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/produto)" = 404
          node index.js
      - name: mostra o package-lock
        run: echo "LOCK $(base64 -w0 package-lock.json)"
